
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a10">
  <title>Unknown Transmission | Ball Ricoshet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #090a10;
      --panel: #11131d;
      --purple: #9b7bff;
      --blue: #5c8dff;
      --text: #f0efff;
      --muted: #777d96;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #222044 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 22px;
    }

    .status {
      color: #8be0b5;
    }

    .panel {
      position: relative;
      padding: 34px 28px;
      background: rgba(17, 19, 29, 0.96);
      border: 1px solid #292b42;
      border-radius: 14px;
      box-shadow: 0 20px 70px #0008;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue), var(--purple));
    }

    .symbol {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin-bottom: 27px;
      border: 1px solid #514477;
      border-radius: 12px;
      color: var(--purple);
      font-size: 28px;
      background: #201a35;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .description {
      color: #a6aac0;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .separator {
      height: 1px;
      background: #292b3d;
      margin: 26px 0;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #d9d7ef;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .input-row {
      display: flex;
      gap: 9px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 15px 13px;
      color: white;
      background: #090b13;
      border: 1px solid #34364d;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
      text-transform: uppercase;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 2px #9b7bff20;
    }

    input::placeholder {
      color: #565b72;
      text-transform: none;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 7px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(120deg, #6550c8, #426dd4);
      transition: filter 0.2s, transform 0.2s;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(0.97);
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #ff9aab;
      background: #3a1925;
      border: 1px solid #6c293d;
    }

    .message.success {
      display: block;
      color: #c6b8ff;
      background: #211a37;
      border: 1px solid #59468b;
    }

    .next-title {
      margin: 0 0 8px;
      color: white;
      font-size: 17px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
      color: #555a70;
      font-size: 9px;
      letter-spacing: 1px;
    }

    @media (max-width: 420px) {
      .panel {
        padding: 27px 19px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        min-height: 46px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="topline">
      <span>BR // ARCHIVE</span>
      <span class="status">● SIGNAL ACTIVE</span>
    </div>

    <section class="panel">
      <div class="symbol">⌁</div>

      <div class="eyebrow">UNKNOWN TRANSMISSION</div>
      <h1>Ты нашёл нас.</h1>

      <p class="description">
        Эта передача не должна была попасть в открытый доступ.
        Если ты здесь, значит, ты обнаружил то, что другие пропустили.
        <br><br>
        У тебя есть код. Введи его, чтобы узнать, что скрывается дальше.
      </p>

      <div class="separator"></div>

      <form id="codeForm">
        <label for="secretCode">ACCESS CODE / КОД ДОСТУПА</label>

        <div class="input-row">
          <input
            id="secretCode"
            type="text"
            placeholder="Введи найденный код..."
            maxlength="40"
            autocomplete="off"
            spellcheck="false"
            required
          >
          <button type="submit">ПРОВЕРИТЬ</button>
        </div>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <div class="footer">
      <span>BALL RICOSHet</span>
      <span>ARCHIVE 001</span>
      <span>UNKNOWN</span>
    </div>
  </main>

  <script>
    // Код, который игрок должен найти в игре.
    const SECRET_CODE = "PRUZEK-07";

    const form = document.getElementById("codeForm");
    const input = document.getElementById("secretCode");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const enteredCode = input.value.trim().toUpperCase();

      if (enteredCode === SECRET_CODE) {
        message.className = "message success";
        message.innerHTML = `
          <h2 class="next-title">ДОСТУП РАЗРЕШЁН</h2>
          Первый барьер пройден.
          <br><br>
          Ты искал буквы, но нашёл нечто большее.
          <br><br>
          <strong>Следующий след находится там,
          где начинается история.</strong>
          <br><br>
          <span style="color:#85809f">
            TRANSMISSION END // 001
          </span>
        `;
      } else {
        message.className = "message error";
        message.textContent =
          "ДОСТУП ОТКЛОНЁН. Код неверный. Проверь найденные символы и попробуй снова.";
      }
    });
  </script>
</body>
</html>
